
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyStock - Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>BeautyStock</h1>
        <p>Gerenciamento de estoque de produtos de beleza</p>
    </header>

    <main>
        <section class="painel">
            <h2>Controle de Estoque</h2>
            <p>Gerencie seus produtos de forma simples.</p>

            <form id="form-produto">
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" required>

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" min="0" required>

                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" min="0" step="0.01" required>

                <button type="submit">Cadastrar Produto</button>
            </form>
        </section>

        <section class="painel">
            <h2>Produtos Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="lista-produtos"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
